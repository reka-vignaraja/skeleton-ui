
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skeleton Loading UI</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./output.css">
</head>

<body class="min-h-screen bg-gray-100 p-6 md:p-10">

    <!-- Page Heading -->
    <h1 class="text-3xl font-bold text-gray-800 mb-8">
        Skeleton Loading Animation
    </h1>

    <!-- Main Container -->
    <div class="max-w-5xl mx-auto">

        <!-- Cards Layout -->
        <div id="skeleton" class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-pulse">

            <!-- LEFT CARD -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden">

                <!-- Image Placeholder -->
                <div class="p-5">
                    <div class="h-48 bg-gray-300 rounded-md"></div>

                    <!-- Text and Button -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mt-5">

                        <div class="space-y-3 flex-1">
                            <div class="h-4 w-24 bg-gray-300 rounded"></div>
                            <div class="h-4 w-36 bg-gray-300 rounded"></div>
                        </div>

                        <!-- Button Placeholder -->
                        <div class="h-10 w-40 bg-gray-300 rounded-full"></div>
                    </div>
                </div>

                <!-- Description Lines -->
                <div class="border-t-2 border-gray-200 p-5 space-y-3">
                    <div class="h-4 w-full bg-gray-300 rounded"></div>
                    <div class="h-4 w-1/3 bg-gray-300 rounded"></div>
                    <div class="h-4 w-4/5 bg-gray-300 rounded"></div>
                    <div class="h-4 w-1/2 bg-gray-300 rounded"></div>
                </div>

                <!-- Bottom Button -->
                <div class="border-t-2 border-gray-200 p-5">
                    <div class="h-9 w-full bg-gray-300 rounded-full"></div>
                </div>

            </div>

            <!-- RIGHT CARD -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden">

                <!-- Profile Header -->
                <div class="flex items-center justify-between gap-5 p-5">

                    <!-- Text Placeholder -->
                    <div class="flex-1 space-y-3">
                        <div class="h-4 w-full bg-gray-300 rounded"></div>
                        <div class="h-4 w-2/3 bg-gray-300 rounded"></div>
                    </div>

                    <!-- Circle Placeholder -->
                    <div class="w-16 h-16 bg-gray-300 rounded-full shrink-0"></div>
                </div>

                <!-- Large Image Placeholder -->
                <div class="border-t-2 border-gray-200 p-5">
                    <div class="h-80 bg-gray-300 rounded-md"></div>
                </div>

            </div>

        </div>
    </div>

<!-- REAL CONTENT -->
<div id="real-content" class="hidden max-w-5xl mx-auto">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- LEFT CARD -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">

            <img
                src="https://picsum.photos/seed/natureview/800/450"
                alt="Nature"
                class="w-full h-48 object-cover"
            >

            <div class="p-5">
                <h2 class="text-xl font-bold text-gray-800">
                    Beautiful Nature
                </h2>

                <p class="text-gray-600 mt-2">
                    Explore beautiful places and enjoy nature.
                </p>

                <button class="mt-5 bg-blue-600 text-white px-6 py-2 rounded-full">
                    Explore More
                </button>
            </div>
        </div>

        <!-- RIGHT CARD -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">

            <div class="flex items-center justify-between p-5">
                <div>
                    <h2 class="font-bold text-gray-800">
                        Travel Gallery
                    </h2>
                    <p class="text-gray-500 text-sm">
                        Explore the world
                    </p>
                </div>

                <div class="w-16 h-16 bg-blue-500 rounded-full
                            flex items-center justify-center text-white font-bold">
                    TG
                </div>
            </div>

            <div class="p-5 border-t border-gray-200">
                <img
                    src="https://picsum.photos/seed/mountainview/800/600"
                    alt="Mountain"
                    class="w-full h-80 object-cover rounded-md"
                >
            </div>
        </div>

    </div>
</div>

    <script src="./script.js"></script>
     
</body>
</html>
